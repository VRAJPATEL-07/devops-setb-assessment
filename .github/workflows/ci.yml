name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: appointment-slots

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile app/*.py tests/*.py
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .
